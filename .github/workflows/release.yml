name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  JBR_BASE: https://cache-redirector.jetbrains.com/intellij-jbr
  # Pinned JetBrains Runtime with JCEF — same tag KCEF vendors (17.0.10 b1087.23).
  # These archives turn every user machine into "zero CEF download" installs.

jobs:
  desktop:
    name: ${{ matrix.os }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jbr: jbrsdk_jcef-17.0.10-windows-x64-b1087.23.tar.gz
          - os: macos-14
            jbr: jbrsdk_jcef-17.0.10-osx-aarch64-b1087.23.tar.gz
          - os: ubuntu-latest
            jbr: jbrsdk_jcef-17.0.10-linux-x64-b1087.23.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep '^newbies.versionName=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 (for Gradle itself)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch JetBrains Runtime with JCEF
        id: jbr
        shell: bash
        run: |
          # Windows git-bash tar mangles "D:\..." drive paths; convert to POSIX
          # (/d/a/...) so tar/curl never see a colon.
          if command -v cygpath >/dev/null 2>&1; then
            TMP_POSIX=$(cygpath -u "$RUNNER_TEMP")
          else
            TMP_POSIX="$RUNNER_TEMP"
          fi
          ROOT="$TMP_POSIX/jbrsrv"
          mkdir -p "$ROOT"
          curl -fL --retry 3 -o "$TMP_POSIX/jbr.tar.gz" "$JBR_BASE/${{ matrix.jbr }}"
          # macOS SDKs nest java under Contents/Home — search 4 levels deep.
          tar -xzf "$TMP_POSIX/jbr.tar.gz" -C "$ROOT"
          HOME_DIR=$(find "$ROOT" -maxdepth 4 -type d -name bin | head -1 | sed 's|/bin$||')
          if [ ! -x "$HOME_DIR/bin/java" ] && [ ! -f "$HOME_DIR/bin/java.exe" ]; then
            echo "java executable not found after tar extraction" >&2
            echo "search root was: $ROOT" >&2
            find "$ROOT" -maxdepth 4 | head -20 >&2
            exit 1
          fi
          echo "home=$(cygpath -w "$HOME_DIR" 2>/dev/null || echo "$HOME_DIR")" >> "$GITHUB_OUTPUT"

      # macOS only: build the .icns from the committed .iconset PNGs (iconutil
      # is a macOS-only tool, so the repo itself cannot ship the icns binaries).
      - name: Generate macOS .icns icons
        if: runner.os == 'macOS'
        shell: bash
        run: |
          iconutil -c icns packaging/icons/iconset/newbiesteam.iconset -o packaging/icons/newbiesteam.icns
          iconutil -c icns packaging/icons/iconset/newbiesdev.iconset -o packaging/icons/newbiesdev.icns

      - name: Install WiX Toolset (MSI packaging)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package both apps (installers + app images)
        shell: bash
        run: |
          ./gradlew -Pnewbies.bundle.javaHome="${{ steps.jbr.outputs.home }}" \
            :app-public:packageDistributionForCurrentOS \
            :app-dev:packageDistributionForCurrentOS \
            --stacktrace

      # Output paths: compose writes into <module>/build/compose/binaries/main/
      # (app images under app/, installers under msi|deb|rpm|dmg|pkg/).
      - name: Smoke test (CEF engine init proof — both apps)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Real smoke runs first on a clean machine: capture the Java
            # process' stdout/stderr (jpackage launcher inherits handles), then
            # a launcher-lifetime diagnostic runs last (never pollutes smoke).
            c1=0; c2=0
            powershell -NoProfile -Command "
              \$exe = 'app-public\build\compose\binaries\main\app\NewbiesTeam\NewbiesTeam.exe';
              \$appDir = 'app-public\build\compose\binaries\main\app\NewbiesTeam';
              \$env:NBT_DESKTOP_SMOKE = '1';
              \$p = Start-Process -FilePath \$exe -WorkingDirectory (Resolve-Path \$appDir).Path -NoNewWindow -RedirectStandardOutput nbt-pub-out.txt -RedirectStandardError nbt-pub-err.txt -PassThru;
              \$o = \$p.WaitForExit(180000);
              Write-Host '==== NewbiesTeam stdout ===='; Get-Content nbt-pub-out.txt -ErrorAction Continue;
              Write-Host '==== NewbiesTeam stderr ===='; Get-Content nbt-pub-err.txt -ErrorAction Continue;
              if (-not \$o) { Write-Host 'still running after 180s — killing'; Stop-Process -Id \$p.Id -Force; exit 1 };
              Write-Host ('NewbiesTeam smoke exit=' + \$p.ExitCode);
              exit \$p.ExitCode
            " || c1=$?
            powershell -NoProfile -Command "
              \$exe = 'app-dev\build\compose\binaries\main\app\NewbiesDev\NewbiesDev.exe';
              \$appDir = 'app-dev\build\compose\binaries\main\app\NewbiesDev';
              \$env:NBT_DESKTOP_SMOKE = '1';
              \$p = Start-Process -FilePath \$exe -WorkingDirectory (Resolve-Path \$appDir).Path -NoNewWindow -RedirectStandardOutput nbt-dev-out.txt -RedirectStandardError nbt-dev-err.txt -PassThru;
              \$o = \$p.WaitForExit(180000);
              Write-Host '==== NewbiesDev stdout ===='; Get-Content nbt-dev-out.txt -ErrorAction Continue;
              Write-Host '==== NewbiesDev stderr ===='; Get-Content nbt-dev-err.txt -ErrorAction Continue;
              if (-not \$o) { Write-Host 'still running after 180s — killing'; Stop-Process -Id \$p.Id -Force; exit 1 };
              Write-Host ('NewbiesDev smoke exit=' + \$p.ExitCode);
              exit \$p.ExitCode
            " || c2=$?
            echo "smoke result: NewbiesTeam=$c1 NewbiesDev=$c2"
            powershell -NoProfile -Command "
              \$root = (Get-Location).Path;
              \$app = Join-Path \$root 'app-public\build\compose\binaries\main\app\NewbiesTeam';
              \$java = Join-Path \$app 'runtime\bin\java.exe';
              Write-Host ('--- bundled java exists: ' + (Test-Path \$java));
              if (Test-Path \$java) {
                & \$java -version 2>&1 | ForEach-Object { Write-Host \$_ };
                Write-Host ('java -version exit=' + \$LASTEXITCODE);
              }
              Write-Host '--- cfg hunt ---';
              Get-ChildItem \$app -Filter *.cfg -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host \$_.FullName };
              Write-Host '--- launcher lifetime probe (30s) ---';
              \$p = Start-Process -FilePath (Join-Path \$app 'NewbiesTeam.exe') -WorkingDirectory \$app -PassThru;
              \$start = Get-Date;
              while (-not \$p.HasExited -and (((Get-Date) - \$start).TotalSeconds -lt 30)) { Start-Sleep -Seconds 3 };
              if (-not \$p.HasExited) { Write-Host 'launcher alive after 30s — engine intact'; Stop-Process -Id \$p.Id -Force }
              else { Write-Host ('launcher exited after ~' + [int](((Get-Date) - \$start).TotalSeconds) + 's code=' + \$p.ExitCode) }
              exit 0
            "
            [ "$c1" = 0 ] && [ "$c2" = 0 ]
            echo "smoke: both apps exited 0 — CEF engine ready"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq xvfb; }
            # jpackage app images keep the launcher under bin/
            for B in app-public/build/compose/binaries/main/app/NewbiesTeam/bin/NewbiesTeam \
                     app-dev/build/compose/binaries/main/app/NewbiesDev/bin/NewbiesDev; do
              timeout 180 xvfb-run -a "./$B"
            done
          else
            # macOS runs a real Window Server but CEF headless quirks remain
            # possible — treat a failure as an advisory warning, not a blocker.
            # macOS has no GNU `timeout`; the app self-exits after its internal
            # 90s CEF deadline, so run it directly.
            for B in app-public/build/compose/binaries/main/app/NewbiesTeam.app/Contents/MacOS/NewbiesTeam \
                     app-dev/build/compose/binaries/main/app/NewbiesDev.app/Contents/MacOS/NewbiesDev; do
              if "./$B"; then
                echo "macOS smoke ok: $B"
              else
                echo "::warning::macOS smoke (advisory) failed: $B"
              fi
            done
            exit 0
          fi
          echo "smoke: both apps exited 0 — CEF engine ready"

      - name: Pack portable bundles (bash OSes)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          (
            cd app-public/build/compose/binaries/main/app
            if [ "$RUNNER_OS" = "macOS" ]; then
              zip -qry "$OLDPWD/out/newbiesteam-$V-mac-portable.zip" NewbiesTeam.app
            else
              zip -qry "$OLDPWD/out/newbiesteam-$V-linux-portable.zip" NewbiesTeam
            fi
          )
          (
            cd app-dev/build/compose/binaries/main/app
            if [ "$RUNNER_OS" = "macOS" ]; then
              zip -qry "$OLDPWD/out/newbiesdev-$V-mac-portable.zip" NewbiesDev.app
            else
              zip -qry "$OLDPWD/out/newbiesdev-$V-linux-portable.zip" NewbiesDev
            fi
          )
          ls -la out/

      - name: Pack portable bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path app-public\build\compose\binaries\main\app\NewbiesTeam -DestinationPath out\newbiesteam-${{ steps.ver.outputs.version }}-win-portable.zip -Force
          Compress-Archive -Path app-dev\build\compose\binaries\main\app\NewbiesDev  -DestinationPath out\newbiesdev-${{ steps.ver.outputs.version }}-win-portable.zip  -Force

      - name: Upload installers + portable bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundles
          path: |
            app-public/build/compose/binaries/main/distributions/*
            app-dev/build/compose/binaries/main/distributions/*
            app-public/build/compose/binaries/main/deb/*
            app-dev/build/compose/binaries/main/deb/*
            app-public/build/compose/binaries/main/rpm/*
            app-dev/build/compose/binaries/main/rpm/*
            app-public/build/compose/binaries/main/dmg/*
            app-dev/build/compose/binaries/main/dmg/*
            app-public/build/compose/binaries/main/msi/*
            app-dev/build/compose/binaries/main/msi/*
            app-public/build/compose/binaries/main/pkg/*
            app-dev/build/compose/binaries/main/pkg/*
            out/*.zip
          if-no-files-found: error

  arch-packages:
    name: Arch Linux packages (.pkg.tar.zst)
    needs: desktop
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git binutils curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep '^newbies.versionName=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download Linux portable bundles
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest-bundles
          path: bundles

      - name: Build .pkg.tar.zst packages
        run: ./scripts/build-arch.sh "${{ steps.ver.outputs.version }}" bundles

      - name: Upload Arch packages
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [desktop, arch-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts

      - name: Flatten artifacts + create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          find artifacts -type f | while read -r f; do cp "$f" dist/; done
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NewbiesTeam & NewbiesDev Desktop $GITHUB_REF_NAME" \
            --notes "Desktop releases for Windows (MSI/portable), macOS (unsigned DMG/portable) and Linux (DEB/RPM/AppImage/portable/Arch .pkg.tar.zst). Every package bundles its own JetBrains Runtime with JCEF — no CEF download needed, even offline." \
            dist/*

          if [ -z "$(find dist -maxdepth 1 -type f -name '*.msi' -print -quit)" ]; then
            echo "warning: no .msi present" >&2
          fi
